services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hotelaria_app

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html
      - ./database/xml:/data/xml:ro

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hotelaria_scheduler

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html
      - ./database/xml:/data/xml:ro

    depends_on:
      db:
        condition: service_healthy

    command: ["cron", "-f"]


  db:
    image: mysql:8.4

    container_name: hotelaria_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: hotelaria
      MYSQL_USER: hotelaria
      MYSQL_PASSWORD: hotelaria
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20


  swagger:
    image: swaggerapi/swagger-ui

    container_name: hotelaria_swagger

    ports:
      - "8081:8080"

    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro

    environment:
      SWAGGER_JSON: /openapi.yaml


volumes:
  mysql_data: